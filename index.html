<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCPD_PRODUCTION</title>

    <!-- STYLE -->
    <link rel="stylesheet" href="style.css">

    <!-- FIREBASE CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div id="menuBtn" onclick="toggleSidebar()">☰</div>
        <h1>SCPD_PRODUCTION</h1>
        <div id="authArea"></div>
    </header>

    <!-- SIDEBAR -->
    <aside id="sidebar">

        <!-- HOME -->
        <button onclick="openScreen('home')">🏠 Beranda</button>

        <!-- UPSCALE -->
        <button onclick="openScreen('upscale')">🖼️ Photo HD / Upscale</button>

        <!-- YOUTUBE -->
        <button onclick="openScreen('ytmp3')">🎧 YouTube MP3</button>
        <button onclick="openScreen('ytmp4')">🎬 YouTube MP4</button>

        <!-- TIKTOK -->
        <button onclick="openScreen('tiktokmp3')">🎧 TikTok MP3</button>
        <button onclick="openScreen('tiktokmp4')">🎬 TikTok MP4</button>

        <!-- INSTAGRAM -->
        <button onclick="openScreen('igmp3')">🎧 Instagram MP3</button>
        <button onclick="openScreen('igmp4')">🎬 Instagram MP4</button>

        <!-- SPOTIFY -->
        <button onclick="openScreen('spotify')">🎵 Spotify</button>
    </aside>

    <!-- HALAMAN -->
    <main id="content">
        <h2>Selamat datang di SCPD_PRODUCTION</h2>
        <p>Pilih fitur dari menu kiri.</p>
    </main>

    <!-- SCRIPT -->
    <script src="script.js"></script>
